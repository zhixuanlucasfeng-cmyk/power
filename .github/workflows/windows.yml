name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test desktop and shared browser tabs
        run: node --test desktop.test.mjs desktop-browser.test.mjs
        env:
          POWER_TEST_DESKTOP: '1'
      - run: npm run windows:build
      - name: Test packaged app startup
        run: node desktop/windows-smoke.mjs
      - name: Build desktop launcher
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /out:dist\Power-Windows-x64\Power.exe desktop\windows\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, launch and uninstall
        run: ./desktop/windows/test-installer.ps1
      - name: Package Windows download
        run: Compress-Archive -Path dist/Power-Windows-x64 -DestinationPath dist/Power-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Power-Windows-x64
          path: |
            dist/Power-Windows-x64.zip
            dist/Power-Setup-x64.exe
