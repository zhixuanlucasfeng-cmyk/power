<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Typhoon night, neon cafe, festival fireworks: a Reze-arc mood. */
  :root {
    --night:#0a0c18; --ink:#11142499; --ink2:#161a2e; --line:#2a2f4d; --text:#ece8f4; --dim:#8f8cab;
    --bomb:#ff5a36; --pink:#ff4f9a; --violet:#8b6cff; --c:#e2283c;
    --display:'Dela Gothic One', sans-serif;
    --cjk:'PingFang SC', 'Hiragino Sans GB', 'Zen Kaku Gothic New', sans-serif;
    --body:'Zen Kaku Gothic New', -apple-system, 'PingFang SC', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; display:grid; grid-template-columns:280px 1fr; color:var(--text); font:15px/1.6 var(--body);
    background:
      radial-gradient(900px 500px at 75% -10%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
      radial-gradient(700px 400px at 10% 110%, #ff4f9a22, transparent 70%),
      linear-gradient(180deg, #0d1022 0%, var(--night) 60%);
    transition: background .6s;
    overflow:hidden;
  }
  /* rain */
  body::before {
    content:''; position:fixed; inset:-50% -10%; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      repeating-linear-gradient(105deg, transparent 0 22px, #9fb7ff14 22px 23px, transparent 23px 61px),
      repeating-linear-gradient(105deg, transparent 0 37px, #9fb7ff0d 37px 38px, transparent 38px 90px);
    animation: rain .55s linear infinite;
  }
  @keyframes rain { to { transform: translate(-60px, 160px); } }
  @media (prefers-reduced-motion: reduce) { body::before { animation:none; } }
  aside, main, #mem, #pact { position:relative; z-index:1; min-height:0; }

  aside, #mem, #pact { background:var(--ink); backdrop-filter: blur(14px); display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #mem { border-right:0; border-left:1px solid var(--line); display:none; }
  body.memopen { grid-template-columns:280px 1fr 300px; }
  body.memopen #mem { display:flex; }
  #pact { border-left:1px solid var(--line); display:none; overflow:hidden; }
  body.pactopen { grid-template-columns:280px 1fr 320px; }
  body.pactopen #pact { display:flex; }
  header .ctl { flex-wrap:wrap; justify-content:flex-end; row-gap:6px; }
  header .ctl button, header .ctl select { white-space:nowrap; }
  header .who { min-width:0; } header .who b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  #pactt.on { border-color:var(--c); color:var(--text); box-shadow:0 0 14px -6px var(--c); }
  #pactbody { overflow:auto; flex:1; padding:0 14px 14px; }
  .pact { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; background:#ffffff05; }
  .pact b { font:600 13px var(--mono); } .pact small { display:block; color:var(--dim); font-size:12px; }
  .pact .pv { font:11px var(--mono); color:var(--dim); margin-top:3px; } .pact.off { opacity:.4; }
  .seal { text-align:center; padding:14px 6px 10px; } .seal b { display:block; font:28px var(--display); color:var(--c); } .seal small { color:var(--dim); }
  #memt.on { border-color:var(--c); color:var(--text); box-shadow:0 0 14px -6px var(--c); }
  .herologo { display:block; width:min(520px, 80%); margin:0 auto; filter:drop-shadow(0 0 28px color-mix(in srgb, var(--c) 50%, transparent)); }
  .logo img { display:block; width:100%; max-width:230px; filter:drop-shadow(0 0 14px color-mix(in srgb, var(--c) 45%, transparent)); }
  .logo { padding:18px 18px 6px; font:28px/1 var(--display); letter-spacing:2px; color:var(--c); text-shadow:0 0 18px color-mix(in srgb, var(--c) 60%, transparent); transition:color .4s; }
  .tag { padding:0 18px 14px; color:var(--dim); font-size:12px; letter-spacing:1px; }
  .sec { padding:10px 18px 6px; font:700 12px var(--cjk); letter-spacing:2px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; }

  .badge { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font:800 20px var(--cjk); color:#fff;
    background: linear-gradient(145deg, var(--k), color-mix(in srgb, var(--k) 35%, #000)); box-shadow: inset 0 0 0 1px #ffffff22; }
  .badge { position:relative; overflow:hidden; }
  .badge img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .card .badge { cursor:copy; }
  .badge.sm { width:30px; height:30px; font-size:15px; border-radius:9px; }

  .ch { display:flex; gap:10px; align-items:center; padding:8px; border-radius:14px; cursor:pointer; border:1px solid transparent; transition:.2s; }
  .ch:hover { background:#ffffff08; }
  .ch.on { border-color:color-mix(in srgb, var(--k) 70%, transparent); background:color-mix(in srgb, var(--k) 14%, transparent); box-shadow:0 0 22px -6px var(--k); }
  .ch b { display:block; font-weight:700; }
  .ch small { color:var(--dim); font-size:12px; }

  button { font:inherit; color:var(--text); background:#ffffff0d; border:1px solid var(--line); border-radius:10px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#4a5180; }
  #tree { overflow:auto; flex:1; padding:0 10px 16px; }
  .ch .who2 { flex:1; min-width:0; } .ch .car { color:var(--dim); font-size:11px; }
  .kids { margin:2px 0 8px 22px; border-left:1px solid color-mix(in srgb, var(--k) 40%, transparent); padding-left:6px; }
  .proj { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:5px 8px; border-radius:8px; cursor:pointer; font-size:13.5px; white-space:nowrap; }
  .proj span:first-child { overflow:hidden; text-overflow:ellipsis; }
  .proj:hover, .proj.on { background:#ffffff0d; }
  .proj .acts { display:none; gap:4px; color:var(--dim); } .proj:hover .acts { display:flex; }
  .proj .acts i { font-style:normal; padding:0 5px; border-radius:5px; } .proj .acts i:hover { background:#ffffff1a; color:var(--text); }
  .proj.add { color:var(--dim); font-size:12.5px; }
  .kids .th { padding-left:26px; font-size:13px; }
  .mini { padding:1px 7px; font-size:11px; border-radius:7px; letter-spacing:0; }
  .stack { display:inline-flex; margin-right:7px; vertical-align:middle; }
  .stack .badge.sm { width:20px; height:20px; font-size:10px; border-radius:6px; margin-right:-6px; box-shadow:0 0 0 2px var(--ink2); }
  .stack.big .badge.sm { width:30px; height:30px; font-size:14px; border-radius:9px; margin-right:-10px; }
  .stack.big { margin-right:14px; }
  .th.grp { display:flex; align-items:center; }
  .gtag { display:inline-block; font-size:10.5px; line-height:1.5; padding:0 6px; border-radius:6px; border:1px solid color-mix(in srgb, var(--k, var(--c)) 45%, transparent); color:color-mix(in srgb, var(--k, var(--c)) 80%, var(--text)); margin-right:3px; }
  .ch.grp { --k:var(--pink); } .ch.grp .stack { margin-right:4px; flex:none; } .ch .who2 small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .ch.grp .who2 b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ren { width:100%; font:inherit; color:var(--text); background:#06070f; border:1px solid var(--c); border-radius:6px; padding:2px 6px; outline:0; }
  .model.final { border-color:var(--k); color:var(--k); margin-left:4px; }
  .card.pickg { position:relative; opacity:.55; } .card.pickg.on { opacity:1; }
  .card .ord { position:absolute; top:6px; right:8px; font:normal 11px var(--body); color:var(--k); }
  body.norain::before { display:none; }
  .tag { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .settings { max-width:760px; margin:0 auto; padding-bottom:30px; }
  .settings h2 { font:800 16px var(--cjk); margin:26px 0 10px; } .settings h2 small { font:400 12px var(--body); color:var(--dim); margin-left:8px; }
  .scard { border:1px solid var(--line); border-radius:14px; background:#ffffff05; overflow:hidden; }
  .srow { display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); }
  .srow:first-child { border-top:0; }
  .sinfo { flex:1; min-width:0; } .sinfo b { display:block; font-size:14px; } .sinfo small { color:var(--dim); font-size:12px; }
  .sinfo code { font-size:11px; }
  .sgroup { color:var(--dim); font-size:12px; margin:14px 2px 6px; letter-spacing:1px; }
  .sbar { display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .sgrp { font:12.5px var(--body); color:var(--text); background:#ffffff0d; border:1px solid var(--line); border-radius:8px; padding:4px 6px; max-width:130px; }
  .sform { display:grid; gap:8px; padding:12px; } .sform input { padding:8px 11px; border-radius:9px; border:1px solid var(--line); background:#06070f; color:var(--text); font:inherit; }
  .sform button { justify-self:end; }
  .sform textarea { padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:#06070f; color:var(--text); font:13px/1.6 var(--body); resize:vertical; }
  .row2 { display:flex; gap:8px; align-items:center; justify-content:flex-end; } .row2 small { margin-right:auto; color:var(--dim); font-size:12px; }
  .sedit { border-top:1px solid var(--line); background:#ffffff04; }
  .sform input, .sform select { padding:7px 10px; border-radius:9px; border:1px solid var(--line); background:#06070f; color:var(--text); font:inherit; }
  pre.pair { font:600 18px var(--mono); color:var(--c); margin:4px 0; }
  .danger { border-color:#ff5a3660; color:#ff8a6a; }
  .sw { position:relative; width:40px; height:22px; flex:none; } .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; border-radius:22px; background:#2a2f4d; transition:.2s; cursor:pointer; }
  .sw span::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.2s; }
  .sw input:checked + span { background:var(--c); } .sw input:checked + span::before { transform:translateX(18px); }
  .gctl { display:flex; gap:10px; justify-content:center; margin-top:22px; }
  #gstart { background:linear-gradient(135deg, var(--bomb), var(--pink)); border:0; color:#fff; font-weight:700; padding:8px 18px; }
  #gstart:disabled { opacity:.4; cursor:default; }
  .th { padding:7px 10px; border-radius:10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); font-size:14px; }
  .th:hover { background:#ffffff08; } .th.on { background:#ffffff12; color:var(--text); }
  .th .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bomb); margin-right:7px; box-shadow:0 0 8px var(--bomb); animation:blink .8s infinite alternate; }
  @keyframes blink { to { opacity:.2; } }

  main { display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:12px; padding:12px max(20px, calc(50% - 400px)); border-bottom:1px solid var(--line); background:#0a0c1880; backdrop-filter:blur(10px); }
  header .who b { font:800 18px var(--cjk); letter-spacing:1px; }
  header .who small { display:block; color:var(--dim); font-size:12px; }
  header .ctl { margin-left:auto; display:flex; gap:8px; }
  select { font:13px var(--body); color:var(--text); background:#ffffff0d; border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
  select option { background:var(--ink2); }

  #chat { flex:1; overflow:auto; padding:26px max(20px, calc(50% - 400px)) 10px; scroll-behavior:smooth; }
  .row { display:flex; gap:12px; margin:0 0 20px; animation:in .25s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .row .body { min-width:0; flex:1; }
  .name { font-size:12.5px; color:var(--dim); margin-bottom:2px; }
  .name b { color:var(--k); font-weight:700; margin-right:6px; }
  .model { font:11px var(--mono); padding:1px 6px; border-radius:6px; border:1px solid var(--line); color:var(--dim); }
  .urow { display:flex; gap:10px; justify-content:flex-end; align-items:flex-start; margin:0 0 20px; }
  .urow .user { margin:0; }
  .user { margin:0 0 20px auto; max-width:78%; width:fit-content; padding:10px 15px; border-radius:16px 16px 4px 16px; white-space:pre-wrap;
    background:linear-gradient(135deg, #2a2f55, #1e2240); border:1px solid #3a4070; }
  .text p { margin:.35em 0; } .text ul { margin:.3em 0; padding-left:1.3em; }
  .text pre { background:#06070f; border:1px solid var(--line); padding:12px; border-radius:10px; overflow:auto; }
  code { font:12.5px var(--mono); } .text :not(pre)>code { background:#ffffff12; padding:1px 6px; border-radius:5px; }
  a { color:var(--pink); }
  details.tool { border:1px solid var(--line); border-left:3px solid var(--k); border-radius:10px; margin:6px 0; background:#0b0e1d; }
  details.tool summary { padding:6px 10px; cursor:pointer; color:var(--dim); font-size:13px; list-style:none; }
  details.tool summary::-webkit-details-marker { display:none; }
  .ok { color:#6fe0a8; } .bad { color:var(--bomb); }
  details.tool pre { margin:0; padding:8px 10px; border-top:1px solid var(--line); max-height:260px; overflow:auto; white-space:pre-wrap; font:12px var(--mono); color:#c9c6dc; }
  .think { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:8px; }
  .think i { width:8px; height:8px; border-radius:50%; background:var(--k); box-shadow:0 0 10px var(--k); animation:blink .6s infinite alternate; }
  .meta { color:var(--dim); font-size:12px; }
  .err { color:var(--bomb); white-space:pre-wrap; }

  #approvals { padding:0 max(20px, calc(50% - 400px)); }
  .appr { border:1px solid var(--bomb); background:#1a0f14; border-radius:14px; padding:10px 14px; margin-top:8px; box-shadow:0 0 30px -12px var(--bomb); }
  .appr pre { white-space:pre-wrap; margin:6px 0; font:13px var(--body); } .appr .go { background:linear-gradient(135deg, var(--bomb), var(--pink)); border:0; color:#fff; font-weight:700; }
  #mchips, #files { display:flex; gap:6px; flex-wrap:wrap; padding:0 2px 6px; }
  .mchip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid color-mix(in srgb, var(--k) 50%, transparent); color:var(--k); cursor:pointer; }
  .fchip { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 8px; border-radius:8px; border:1px solid var(--line); background:#ffffff08; }
  .fchip img { width:28px; height:28px; object-fit:cover; border-radius:5px; } .fchip i { font-style:normal; cursor:pointer; color:var(--dim); }
  .atts { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .atts img { max-width:220px; max-height:160px; border-radius:8px; } .atts .file { font-size:12.5px; opacity:.85; }
  #attach { flex:none; background:transparent; border:0; font-size:18px; padding:6px; }
  .routed { margin:-8px 0 12px 42px; }
  #composer { padding:10px max(20px, calc(50% - 400px)) 18px; }
  #box { border:1px solid var(--line); border-radius:18px; background:#0d1022cc; padding:10px 10px 10px 16px; display:flex; gap:10px; align-items:flex-end; transition:.2s; }
  #box:focus-within { border-color:color-mix(in srgb, var(--c) 70%, transparent); box-shadow:0 0 30px -10px var(--c); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:15px/1.5 var(--body); min-height:26px; max-height:220px; padding:6px 0; }
  #send { flex:none; font:15px 'Dela Gothic One', 'PingFang SC', sans-serif; letter-spacing:1px; color:#fff; border:0; padding:10px 18px; border-radius:12px;
    background:linear-gradient(135deg, var(--bomb), var(--pink)); box-shadow:0 6px 20px -6px var(--bomb); }
  #send.stop { background:#3a3f63; box-shadow:none; }
  .hint { color:var(--dim); font-size:11.5px; text-align:center; margin-top:6px; }

  /* boom flash on send */
  #boom { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0; background:radial-gradient(circle at var(--x, 70%) var(--y, 90%), #ff8a3dcc, #ff4f9a55 18%, transparent 45%); }
  #boom.go { animation:boom .6s ease-out; }
  @keyframes boom { 0% { opacity:.9; } 100% { opacity:0; } }

  #dir { font-size:13px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #mem input { margin:0 14px 10px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#06070f; color:var(--text); font:inherit; }
  #memlist { overflow:auto; flex:1; padding:0 14px 14px; }
  .m { padding:9px 30px 9px 11px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:13.5px; position:relative; background:#ffffff05; }
  .m small { color:var(--dim); display:block; font-size:11.5px; }
  .m .x { position:absolute; top:5px; right:5px; border:0; background:none; color:var(--dim); padding:2px 6px; }
  .m .x:hover { color:var(--bomb); }

  .hero { text-align:center; margin-top:12vh; }
  .hero h1 { font:clamp(42px, 7vw, 76px)/1 var(--display); margin:0; letter-spacing:4px; color:var(--c);
    text-shadow:0 0 30px color-mix(in srgb, var(--c) 55%, transparent), 4px 4px 0 #00000080; }
  .hero p { color:var(--dim); margin:10px 0 26px; }
  .cards { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .card { width:138px; padding:14px 10px; border-radius:16px; border:1px solid var(--line); background:#ffffff06; cursor:pointer; transition:.2s; }
  .card:hover, .card.on { border-color:var(--k); box-shadow:0 0 26px -8px var(--k); transform:translateY(-2px); }
  .card .badge { margin:0 auto 8px; width:54px; height:54px; font-size:26px; border-radius:16px; }
  .card b { display:block; } .card small { color:var(--dim); font-size:12px; }

  @media (max-width: 1000px) { body, body.memopen, body.pactopen { grid-template-columns:1fr; } aside, #mem, #pact, body.memopen #mem, body.pactopen #pact { display:none; } }
</style>
</head>
<body>
<aside>
  <div class="logo"><img src="/avatar/logo" alt="POWER" onerror="this.outerHTML='POWER'"></div>
  <div class="tag">你的私人 Agent 小队 <button id="gear" class="mini" title="设置">⚙️ 设置</button></div>
  <div id="tree"></div>
</aside>
<main>
  <header>
    <span class="badge" id="hb"></span>
    <div class="who"><b id="hn"></b><small id="hr"></small></div>
    <div class="ctl">
      <button id="dir" title="工作文件夹：它们能读写这里的文件"></button>
      <button id="new" title="在当前项目里开新对话">＋ 新对话</button>
      <select id="model" title="模型"></select>
      <select id="effort" title="思考深度">
        <option value="low">思考 · 低</option><option value="medium">思考 · 中</option>
        <option value="high">思考 · 高</option><option value="xhigh">思考 · 很高</option><option value="max">思考 · 最大</option>
      </select>
      <button id="memt" title="打开 / 收起记忆本">🧠 记忆本</button>
      <button id="pactt" title="恶魔契约：Contract 工具网关">📜 契约</button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="approvals"></div>
  <div id="composer">
    <div id="mchips"></div>
    <div id="files"></div>
    <div id="box">
      <button id="attach" title="添加图片或文件（也可以直接粘贴、拖进来）">📎</button>
      <input id="filepick" type="file" multiple hidden>
      <textarea id="input" rows="1" placeholder="说吧…"></textarea>
      <button id="send">BOOM</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</main>
<section id="mem">
  <div class="sec" style="padding-top:20px">记忆本</div>
  <input id="q" placeholder="搜索它记得的事…">
  <div id="memlist"></div>
</section>
<section id="pact">
  <div class="sec" style="padding-top:20px">恶魔契约</div>
  <div id="pactbody"></div>
</section>
<div id="boom"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const LOOK = { me: { k:'#ffb21e', g:'我' } }; // characters bring their own colors in the persona pack
let META, cur = null, busy = false, dir = localStorage.getItem('dir') || '';
let char = localStorage.getItem('char') || '';
let PROJECTS = {}, THREADS = [], folderCb = null;
let group = null; // { members, rounds } while in a group chat
const open_ = new Set((() => { try { return JSON.parse(localStorage.getItem('open')) || []; } catch { return []; } })());
const prefs = (() => { try { return JSON.parse(localStorage.getItem('prefs')) || {}; } catch { return {}; } })();
let av = Date.now(); // bump to reload pictures after an upload
const badge = (c, sm) => `<span class="badge${sm ? ' sm' : ''}" style="--k:${look(c).k}">${look(c).g}<img src="/avatar/${c}?v=${av}" alt="" onerror="this.remove()"></span>`;
const modelName = (m) => META.models[m] || m;
const nm = (c) => { const x = META.chars[c]; return !x ? c : x.name === x.zh ? x.name : `${x.name} (${x.zh})`; };
function look(c) {
  if (META?.chars[c]?.look) return META.chars[c].look;
  if (c === 'me') return { k: LOOK.me.k, g: (META?.settings.userName || '我').charAt(0) };
  if (LOOK[c]) return LOOK[c];
  let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const n = META?.chars[c]?.name ?? c;
  return { k: `hsl(${h} 65% 62%)`, g: n.replace(/^Ollama · /, '').charAt(0).toUpperCase() };
}
const visible = () => Object.entries(META.chars).filter(([, x]) => !x.hidden);
const isClaude = (c) => META.chars[c]?.engine === 'claude';

function md(s) {
  const parts = String(s).split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let out = '';
  for (let i = 0; i < parts.length; i += 3) {
    out += esc(parts[i]).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      .split(/\n{2,}/).map((p) => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
    if (parts[i + 2] !== undefined) out += `<pre><code>${esc(parts[i + 2])}</code></pre>`;
  }
  return out;
}

const TOOL = { Bash:'运行命令', Read:'读文件', Write:'写文件', Edit:'改文件', WebSearch:'搜索网页', WebFetch:'打开网页', Agent:'派分身', Skill:'用技能' };
function toolLabel(name, input) {
  const n = name.replace(/^mcp__plugin_power_memory__/, '').replace(/^mcp__claude-in-chrome__/, 'Chrome · ').replace(/^mcp__contract__/, '📜 契约 · ').replace(/^mcp__cua__/, '🖥 桌面 · ').replace(/^mcp__/, '');
  const nice = { memory_save:'💾 记下来', memory_search:'🔎 翻记忆', memory_forget:'🗑 忘掉', skill_save:'📘 写技能' }[n] || TOOL[n] || n;
  if (n === 'Bash' && /^\s*hermes\b/.test(input.command)) return `🤝 叫 Hermes <span style="opacity:.65">${esc(input.command.slice(0, 80))}</span>`;
  if (n === 'Bash' && /^\s*opencode\b/.test(input.command)) return `🤝 叫 opencode <span style="opacity:.65">${esc(input.command.slice(0, 80))}</span>`;
  const hint = input.command || input.query || input.file_path || input.url || input.content || input.name || '';
  return `${nice} <span style="opacity:.65">${esc(String(hint).slice(0, 80))}</span>`;
}

// One assistant turn = one row with the character badge; text/tools stream into its body.
let turn = null; const tools = {};
function newTurn(c, model, final) {
  const r = document.createElement('div'); r.className = 'row'; r.style.setProperty('--k', look(c).k);
  r.innerHTML = `${badge(c, true)}<div class="body"><div class="name"><b>${esc(nm(c))}</b><span class="model">${esc(META.chars[c]?.engine === 'claude' ? modelName(model ?? '') : (menuOf(c)?.find((o) => o.id === model)?.label ?? META.chars[c]?.model ?? model ?? ''))}</span>${final ? '<span class="model final">总结</span>' : ''}</div></div>`;
  $('#chat').append(r); turn = r.querySelector('.body');
}
function render(e) {
  const chat = $('#chat');
  if (e.t === 'user') { chat.insertAdjacentHTML('beforeend', `<div class="urow"><div class="user">${esc(e.d)}${attachHtml(e.files)}</div>${badge('me', true)}</div>`); if (e.members?.length > 1) turn = null; else newTurn(e.char || char, e.model); }
  else if (e.t === 'speaker') newTurn(e.who, e.model, e.final);
  else if (e.t === 'routed') chat.insertAdjacentHTML('beforeend', `<div class="meta routed">→ ${esc(nm(e.lead))} 主答${e.helpers?.length ? `，${e.helpers.map(nm).map(esc).join('、')} 补充` : ''}</div>`);
  else if (e.t === 'approval') chat.insertAdjacentHTML('beforeend', `<div class="meta">🛡 请求确认：发给 ${esc(e.recipient)}（${esc(e.platform)}）</div>`);
  else if (e.t === 'approval_done') chat.insertAdjacentHTML('beforeend', `<div class="meta">${e.approved ? '✅ 你同意了发送' : '⛔ 没有发送'}</div>`);
  else if (!turn) return;
  else if (e.t === 'text' || e.t === 'text_start') {
    turn.querySelector('.think')?.remove();
    const last = turn.lastElementChild;
    if (e.t === 'text' && last?.classList.contains('text')) { last._raw += e.d; last.innerHTML = md(last._raw); }
    else { const d = document.createElement('div'); d.className = 'text'; d._raw = e.d || ''; d.innerHTML = md(d._raw); turn.append(d); }
  } else if (e.t === 'thinking' || e.t === 'wait') {
    const th = turn.querySelector('.think');
    const mmss = (x) => (x >= 60 ? `${Math.floor(x / 60)} 分 ${x % 60} 秒` : `${x} 秒`);
    const label = e.t === 'wait' ? `<i></i>${esc(e.who)} 还在做 · ${mmss(e.s)}（这个 Agent 做完才一次性回复）` : `<i></i>思考中${e.n ? ` · ${e.n} tokens` : '…'}`;
    if (th && th === turn.lastElementChild) th.innerHTML = label;
    else { th?.remove(); turn.insertAdjacentHTML('beforeend', `<div class="think">${label}</div>`); }
  } else if (e.t === 'tool') {
    turn.querySelector('.think')?.remove();
    const d = document.createElement('details'); d.className = 'tool';
    d.innerHTML = `<summary>${toolLabel(e.name, e.input || {})} <span class="st">…</span></summary><pre>${esc(JSON.stringify(e.input, null, 2))}</pre>`;
    tools[e.id] = d; turn.append(d);
  } else if (e.t === 'tool_result') {
    const d = tools[e.id]; if (!d) return;
    d.querySelector('.st').outerHTML = e.error ? '<span class="bad">✗</span>' : '<span class="ok">✓</span>';
    d.insertAdjacentHTML('beforeend', `<pre>${esc(e.out)}</pre>`);
  } else if (e.t === 'done') {
    turn.querySelector('.think')?.remove();
    if (e.error) turn.insertAdjacentHTML('beforeend', `<div class="err">⚠ ${esc(e.error)}</div>`);
    else if (e.ms) turn.insertAdjacentHTML('beforeend', `<div class="meta">${(e.ms / 1000).toFixed(1)}s</div>`);
  }
  chat.scrollTop = chat.scrollHeight;
}

// Model + depth menus: Claude's list for the crew, the engine's own list for agents that have one (Codex).
const EFF = { minimal: '最低', low: '低', medium: '中', high: '高', xhigh: '很高', max: '最大', ultra: '极限' };
const menuOf = (c) => { const d = META.chars[c]; return d.engine === 'claude'
  ? Object.entries(META.models).map(([id, label]) => ({ id, label, efforts: ['low', 'medium', 'high', 'xhigh', 'max'] }))
  : META.engineModels?.[d.engine] ?? null; };
function fillModels(c, p = prefs[c] || {}) {
  const d = META.chars[c], menu = menuOf(c);
  $('#model').hidden = $('#effort').hidden = !menu;
  if (!menu) return;
  $('#model').innerHTML = (d.engine === 'claude' ? '' : '<option value="">默认模型</option>') + menu.map((m) => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('');
  $('#model').value = p.model ?? (d.engine === 'claude' || menu.some((m) => m.id === d.model) ? d.model : '');
  const efforts = menu.find((m) => m.id === $('#model').value)?.efforts ?? [];
  $('#effort').hidden = !efforts.length;
  $('#effort').innerHTML = efforts.map((e) => `<option value="${e}">思考 · ${EFF[e] ?? e}</option>`).join('');
  $('#effort').value = efforts.includes(p.effort) ? p.effort : efforts.includes(d.effort) ? d.effort : efforts.includes('medium') ? 'medium' : efforts[0] ?? '';
}
const modelLabel = (k) => { const x = META.chars[k], m = (prefs[k] || {}).model;
  if (x.engine === 'claude') return modelName(m || x.model);
  return menuOf(k)?.find((o) => o.id === (m ?? x.model))?.label ?? x.model; };
function savePref() { prefs[char] = { model: $('#model').value, effort: $('#effort').value }; localStorage.setItem('prefs', JSON.stringify(prefs)); pick(char); }

async function loadThreads() {
  [THREADS, PROJECTS] = await Promise.all([fetch('/api/threads').then((r) => r.json()), fetch('/api/projects').then((r) => r.json())]);
  renderTree();
}

// Sidebar like Codex: group → character → project folders → chats.
const short = (d) => d.replace(/^\/Users\/[^/]+/, '~');
const base = (d) => (short(d) === '~' ? '主目录 ~' : d.split('/').filter(Boolean).pop());
let renaming = false;
function renderTree() {
  if (!META || renaming) return;
  // One WeChat-style list: people and group chats together, most recent conversation on top; the group
  // (公安 / 校园 / …) is a tag under each name instead of a section you have to scroll to.
  const last = {};
  for (const t of THREADS) if (t.char && !(last[t.char] > t.updated)) last[t.char] = t.updated;
  const items = [
    ...THREADS.filter((t) => t.members?.length > 1).map((t) => ({ kind: 'group', t, at: t.updated })),
    ...visible().map(([k, x]) => ({ kind: 'char', k, x, at: last[k] ?? '' })),
  ].sort((a, b) => b.at.localeCompare(a.at)); // stable: never-used characters keep the pack's order
  const head = `<div class="sec">聊天 <span><button class="mini" data-act="newgroup" title="新群聊">＋ 群聊</button> <button class="mini" data-act="rescan" title="重新扫描本机 Agent">🔍</button></span></div>`;
  $('#tree').innerHTML = head + items.map((it) => {
    if (it.kind === 'group') {
      const t = it.t;
      return `<div class="ch grp ${t.id === cur ? 'on' : ''}" data-act="thread" data-id="${t.id}"><span class="stack">${t.members.slice(0, 3).map((m) => badge(m, true)).join('')}</span>` +
        `<div class="who2"><b>${t.running ? '<span class="dot"></span>' : ''}${esc(t.title)}</b><small><span class="gtag">群聊</span> ${t.members.length} 人 · ${esc(t.members.map(nm).join('、'))}</small></div></div>`;
    }
    const { k, x } = it, isOpen = open_.has(k);
    const row = `<div class="ch ${k === char ? 'on' : ''}" data-act="char" data-c="${k}" style="--k:${look(k).k}">${badge(k, true)}<div class="who2"><b>${esc(nm(k))}</b><small><span class="gtag">${esc(x.group)}</span> ${esc(x.role)} · ${esc(modelLabel(k))}</small></div><span class="car">${isOpen ? '▾' : '▸'}</span></div>`;
    if (!isOpen) return row;
    const projs = (PROJECTS[k] || []).map((d) => {
      const ts = THREADS.filter((t) => t.char === k && t.dir === d);
      const here = k === char && d === dir;
      return `<div class="proj ${here && !cur ? 'on' : ''}" data-act="proj" data-k="${k}" data-d="${esc(d)}" title="${esc(short(d))}"><span>📁 ${esc(base(d))}</span>` +
        `<span class="acts"><i data-act="newin" title="新对话">＋</i>${short(d) === '~' ? '' : '<i data-act="rmproj" title="从列表移除（不删文件）">×</i>'}</span></div>` +
        ts.map((t) => `<div class="th ${t.id === cur ? 'on' : ''}" data-act="thread" data-id="${t.id}">${t.running ? '<span class="dot"></span>' : ''}${esc(t.title)}</div>`).join('');
    }).join('');
    return row + `<div class="kids" style="--k:${look(k).k}">${projs}<div class="proj add" data-act="addproj" data-k="${k}">＋ 添加项目文件夹</div></div>`;
  }).join('');
}

async function addProject(k, d) {

  await loadThreads();
}

async function poll(id) {

    await new Promise((r) => setTimeout(r, 1500));
    const t = await (await fetch('/api/thread/' + id)).json();
    if (!t.running) { if (cur === id) open(id); return; }
    if (cur === id && t.events.length !== seen) { seen = t.events.length; $('#chat').innerHTML = ''; turn = null; t.events.forEach(render); render({ t: 'thinking' }); }
  }
}

  $('#input').addEventListener('paste', (e) => { const fs = [...(e.clipboardData?.files ?? [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } });
  $('#composer').addEventListener('dragover', (e) => e.preventDefault());
  $('#composer').addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); addFiles([...e.dataTransfer.files]); } });
  $('#mchips').onclick = (e) => { const n = e.target.dataset?.mention; if (!n) return; const i = $('#input'); i.value = `@${n} ` + i.value.replace(/^@\S+\s*/, ''); i.focus(); };
  setDir(dir);
  // Right side holds one panel at a time: 记忆本 or 恶魔契约.
  const memOpen = (o) => { if (o) pactOpen(false); document.body.classList.toggle('memopen', o); $('#memt').classList.toggle('on', o); try { localStorage.setItem('mem', o ? '1' : ''); } catch {} if (o) loadMem(); };
  const pactOpen = (o) => { if (o) memOpen(false); document.body.classList.toggle('pactopen', o); $('#pactt').classList.toggle('on', o); if (o) loadPact(); };
  $('#pactt').onclick = () => pactOpen(!document.body.classList.contains('pactopen'));
  memOpen(META.settings.memOpen);
  $('#memt').onclick = () => memOpen(!document.body.classList.contains('memopen'));
  $('#dir').onclick = () => pickFolder((d) => addProject(char, d).then(() => newChat(char, d)));
  // Custom pictures: double-click or drop an image on any character badge.
  const up = async (c, file) => {
    if (!file?.type.startsWith('image/')) return;
    const r = await fetch('/avatar/' + c, { method: 'POST', headers: { 'content-type': file.type }, body: file });
    if (!r.ok) return alert((await r.json()).error);
    av = Date.now(); pick(char); if (!cur) hero();
  };
  const picker = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif' });
  document.addEventListener('dblclick', (e) => { const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return; picker.onchange = () => up(c, picker.files[0]); picker.value = ''; picker.click(); });
  document.addEventListener('dragover', (e) => { if (e.target.closest('[data-c]')) e.preventDefault(); });
  document.addEventListener('drop', (e) => { const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return; e.preventDefault(); up(c, e.dataTransfer.files[0]); });
})();
</script>
</body>
